# tesla-linux: multi-uplink on one subnet (see docs/SOURCE-ROUTING.md).
# Answer ARP only for an address on the receiving interface, and announce with
# the outgoing interface's own address; loose reverse-path filtering.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_announce = 2
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
