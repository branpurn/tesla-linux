<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tesla Linux</title>
<style>
body{margin:0;background:#0b0b0b;color:#e8e8e8;font:16px/1.5 system-ui,sans-serif;padding:20px}
h1{font-size:22px;margin:0 0 8px;color:#8ecdff}
p{color:#aaa;margin:0 0 16px;max-width:36em}
form{max-width:28em;display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:4px}
input,button,select{font:inherit;padding:8px 10px;border:1px solid #333;border-radius:6px;background:#161616;color:#e8e8e8}
button{background:#1b4f7a;border-color:#2a6ea8;color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#status{margin-top:14px;min-height:1.4em}
.ok{color:#7bff9e}.bad{color:#ff7b7b}
a{color:#8ecdff}
.psk-row{display:flex;gap:8px}
.psk-row input{flex:1;min-width:0}
.psk-row button{flex:0 0 auto;background:#161616;border-color:#333;color:#e8e8e8}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;max-width:36em}
.modes button[aria-pressed="true"]{outline:2px solid #8ecdff}
#join[hidden],#wan[hidden]{display:none}
</style>
<h1>Wi-Fi</h1>
<div class="modes" role="group" aria-label="Mode">
  <button type="button" id="pick-station" aria-pressed="true">Join</button>
  <button type="button" id="pick-wan" aria-pressed="false">WAN rebroadcast</button>
</div>
<div id="join">
  <p>Join the same Wi-Fi network as the car</p>
  <form id="f">
    <label>Network
      <select id="scan" hidden></select>
      <input id="ssid" name="ssid" autocomplete="off">
    </label>
    <label>Password
      <span class="psk-row">
        <input id="psk" name="psk" type="password" autocomplete="new-password">
        <button type="button" id="peek" aria-pressed="false">Show</button>
      </span>
    </label>
    <button id="go" type="submit">Join</button>
  </form>
</div>
<div id="wan" hidden>
  <p>Keep TeslaLinux AP up. Plug ethernet for uplink. Clients on TeslaLinux get internet. Open http://10.42.0.1/ — do not hunt a DHCP station IP.</p>
  <p id="wan-facts">TeslaLinux AP stays up at 10.42.0.1/24. Factory ethernet is 10.42.1.1/24 for management.</p>
</div>
<p id="status"></p>
<p><a href="desktop.html">Desktop</a> · <a href="probe.html">Probe</a></p>
<script>
const wlanApi='/api/wlan';
const modeApi='/api/mode';
const STATION='station';
const WAN='wan_rebroadcast';
const $=id=>document.getElementById(id);
const status=m=>{ $('status').innerHTML=m; };

function fail(r){
  const hint=r?'HTTP '+r.status:'error';
  return '<span class="bad">Couldn\'t join</span> ('+hint+')';
}

async function fetchRel(url, opts){
  const ac=new AbortController();
  const t=setTimeout(()=>ac.abort(),15000);
  try{
    return await fetch(url, Object.assign({signal:ac.signal, credentials:'same-origin'}, opts));
  }finally{ clearTimeout(t); }
}

function paintWan(data){
  const ap=(data&&data.ap)||{};
  const up=(data&&data.uplink)||{};
  const ssid=(typeof ap.ssid==='string'&&ap.ssid.trim())?ap.ssid.trim():'TeslaLinux';
  const addr=(typeof ap.addr==='string'&&ap.addr.trim())?ap.addr.trim():'10.42.0.1/24';
  // GET shape: {mode, ap:{up,ssid,addr}, uplink:{kind,iface,addr}, nat}.
  // Skeleton uplink.kind is none and nat is false until Infra. No LTE chrome.
  const bits=[ssid+' AP stays up at '+addr+'.'];
  if(ap.up===true) bits.push('AP is up.');
  if(up.kind==='ethernet') bits.push('Uplink is ethernet.');
  bits.push('Factory ethernet is 10.42.1.1/24 for management.');
  $('wan-facts').textContent=bits.join(' ');
}

function showMode(mode, data){
  const wan=mode===WAN;
  $('join').hidden=wan;
  $('wan').hidden=!wan;
  $('pick-station').setAttribute('aria-pressed', wan?'false':'true');
  $('pick-wan').setAttribute('aria-pressed', wan?'true':'false');
  if(wan) paintWan(data||null);
}

function modeFrom(data){
  return data && data.mode===WAN ? WAN : STATION;
}

function backendMissing(r){
  return !r || r.status===404 || r.status===501;
}

let scanned=false;
async function maybeScan(){
  if(scanned) return;
  status('Scanning');
  try{
    const r=await fetchRel(wlanApi,{method:'GET'});
    if(r.status===501 || !r.ok) return;
    const data=await r.json();
    const list=Array.isArray(data)?data: (data.ssids||data.networks||data.scan||[]);
    if(Array.isArray(list)) fillScan(list);
    scanned=true;
  }catch(e){ /* no scan endpoint — typing the SSID is enough */ }
  finally{
    if($('status').textContent==='Scanning') status('');
  }
}

function fillScan(list){
  const names=list.map(x=>typeof x==='string'?x:(x&&x.ssid)||'').map(s=>String(s).trim()).filter(Boolean);
  if(!names.length) return;
  const sel=$('scan');
  sel.hidden=false;
  sel.replaceChildren();
  const blank=document.createElement('option');
  blank.value='';
  blank.textContent='Choose a network…';
  sel.appendChild(blank);
  names.forEach(n=>{
    const o=document.createElement('option');
    o.value=n;
    o.textContent=n;
    sel.appendChild(o);
  });
  sel.addEventListener('change',()=>{ if(sel.value) $('ssid').value=sel.value; });
}

async function loadMode(){
  try{
    const r=await fetchRel(modeApi,{method:'GET'});
    if(backendMissing(r) || !r.ok){
      showMode(STATION);
      maybeScan();
      return;
    }
    const data=await r.json();
    const mode=modeFrom(data);
    showMode(mode, data);
    if(mode===STATION) maybeScan();
  }catch(e){
    showMode(STATION);
    maybeScan();
  }
}

async function selectMode(mode){
  showMode(mode);
  if(mode===STATION) maybeScan();
  try{
    const r=await fetchRel(modeApi,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({mode})
    });
    if(backendMissing(r)) return;
    if(!r.ok) return;
    let posted=null;
    try{ posted=await r.json(); }catch(e){}
    if(posted && posted.ok && (posted.mode===STATION || posted.mode===WAN)){
      showMode(posted.mode, posted);
    }
    const g=await fetchRel(modeApi,{method:'GET'});
    if(backendMissing(g) || !g.ok) return;
    const data=await g.json();
    showMode(modeFrom(data), data);
  }catch(e){ /* 404/offline: chrome still switches */ }
}

$('f').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const ssid=$('ssid').value.trim();
  const psk=$('psk').value;
  if(!ssid){ status('<span class="bad">Couldn\'t join</span>'); return; }
  $('go').disabled=true;
  status('Joining');
  try{
    const r=await fetchRel(wlanApi,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ssid, psk})
    });
    if(!r.ok){ status(fail(r)); return; }
    status('<span class="ok">Saved</span><br>Next boot joins that WLAN.');
  }catch(e){
    const hung=e && e.name==='AbortError';
    status('<span class="bad">Couldn\'t join</span> ('+(hung?'timeout':'error')+')');
  }finally{ $('go').disabled=false; }
});

$('peek').addEventListener('click',()=>{
  const p=$('psk'), show=p.type==='password';
  p.type=show?'text':'password';
  $('peek').textContent=show?'Hide':'Show';
  $('peek').setAttribute('aria-pressed', show?'true':'false');
});

$('pick-station').addEventListener('click',()=>selectMode(STATION));
$('pick-wan').addEventListener('click',()=>selectMode(WAN));

loadMode();
</script>
