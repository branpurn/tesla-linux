<!doctype html>
<!-- Clear (non-DRM) H.264 playback page for probe.py: clear.html#src=clip.mp4 (path relative to this dir).
     Used to show that /dev/video10 (V4L2 HW decode) is held for clear H.264 in the same browser. -->
<html><head><meta charset="utf-8"><title>tl-clear</title>
<style>html,body{margin:0;background:#222;color:#eee}video{width:100%;max-height:80vh;background:#000}</style></head>
<body><video id="v" muted autoplay loop playsinline></video><pre id="o"></pre>
<script>
const P = new URLSearchParams(location.hash.slice(1));
const v = document.getElementById('v'); v.src = P.get('src') || 'clip.mp4';
window.S = {phase: 'init'};
v.play().catch(e => { S.error = String(e); });
setInterval(() => { const q = v.getVideoPlaybackQuality(); S.t = v.currentTime; S.vw = v.videoWidth; S.vh = v.videoHeight;
  S.frames = q.totalVideoFrames; S.dropped = q.droppedVideoFrames; S.phase = 'playing'; }, 500);
</script></body></html>
