<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tesla Linux</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;display:flex;flex-direction:column;
  font:13px ui-monospace,Consolas,monospace;color:#9f9}
#wrap{position:absolute;inset:0;width:100%}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;display:block;pointer-events:none}
#feed{position:absolute;inset:0;z-index:1;touch-action:none;cursor:crosshair;
  pointer-events:auto;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#hud{position:absolute;top:0;left:0;right:0;z-index:5;pointer-events:none;padding:4px 8px;background:rgba(0,0,0,.65);font-size:12px;
  -webkit-user-select:none;user-select:none}
#hud.hide{display:none}
#bar{position:absolute;bottom:0;left:0;right:0;z-index:5;padding:6px 8px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.65)}
#bar button{font:inherit;padding:6px 12px;border:1px solid #2a6ea8;
  border-radius:6px;background:#1b4f7a;color:#fff;cursor:pointer}
#bar button:disabled{opacity:.5;cursor:default}
#bar .hint{opacity:.85}
body.chrome-off #hud,body.chrome-off #bar{display:none}
/* Stretch: canvas fills the viewport, aspect NOT preserved (X screen stays 1088x832). */
body.fit-stretch #stage canvas{width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;object-fit:fill}
</style>
<div id="hud">starting…</div>
<div id="wrap"><div id="stage"><canvas id="c" width="1280" height="720"></canvas><div id="feed"></div></div></div>
<div id="bar"><button type="button" id="reboot">Reboot</button><button type="button" id="fit">Fit: Fixed</button><button type="button" id="fs" hidden>Fullscreen</button><button type="button" id="hide">Hide</button><span class="hint">Next boot joins that WLAN.</span></div>
<script>
const hud=document.getElementById('hud');
let canvas=document.getElementById('c'), ctx=null;
const feed=document.getElementById('feed');
const secure = location.protocol==='https:';
const base = `${secure?'wss':'ws'}://${location.host}`;
const hasWC=('VideoDecoder' in window);
let dec=null, decKind='', cfg=false, started=false, spsPps=null, ts=0, frames=0, bytes=0, t0=Date.now(), setup=null;
const hx=n=>n.toString(16).padStart(2,'0');
function hudMsg(m){ hud.textContent=m; }
function paintHud(w,h){
  const fps=(frames/((Date.now()-t0)/1000)).toFixed(1);
  const aheadMs=(!actx||!audioOn)?'—':Math.round(Math.max(0,(playAt-actx.currentTime)*1000));
  hudMsg(`${w||canvas.width}x${h||canvas.height} · ${fps} fps · ${(bytes/1024/1024).toFixed(1)} MiB · ${frames} frames · ${decKind||'?'} · audio:${!actx?'off':(actx.state==='running'&&audioOn?'on':actx.state)} · ahead_ms:${aheadMs} · click/drag to control`);
}
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=src;
    s.onload=res; s.onerror=()=>rej(new Error('load '+src));
    document.head.appendChild(s);
  });
}

/* ---------- video ---------- */
function scan(b){
  const types=new Set(); let spsOff=-1;
  for(let i=0;i+4<b.length;i++){
    if(b[i]===0&&b[i+1]===0&&(b[i+2]===1||(b[i+2]===0&&b[i+3]===1))){
      const off=(b[i+2]===1)?i+3:i+4; if(off>=b.length) continue;
      const t=b[off]&0x1f; types.add(t); if(t===7&&spsOff<0) spsOff=off;
    }
  }
  return {types,spsOff};
}
const cat=(a,b)=>{const o=new Uint8Array(a.length+b.length);o.set(a,0);o.set(b,a.length);return o;};

function adoptPlayerCanvas(p){
  p.canvas.id='c';
  p.canvas.style.maxWidth='100%';
  p.canvas.style.maxHeight='100%';
  p.canvas.style.display='block';
  p.canvas.style.pointerEvents='none';
  canvas.replaceWith(p.canvas);
  canvas=p.canvas;
}
function waitBroadwayWorker(p,ms){
  return new Promise((res,rej)=>{
    if(!p.worker){ res(); return; }
    const t=setTimeout(()=>rej(new Error('broadway worker timeout')), ms||15000);
    function onMsg(e){
      if(e.data && e.data.consoleLog==='broadway worker initialized'){
        clearTimeout(t); p.worker.removeEventListener('message', onMsg); res();
      }
    }
    p.worker.addEventListener('message', onMsg);
  });
}

const broadwayScripts=hasWC?null:
  loadScript('broadway/Decoder.js')
    .then(()=>loadScript('broadway/YUVCanvas.js'))
    .then(()=>loadScript('broadway/Player.js'));

async function mkBroadway(){
  try{
    if(broadwayScripts) await broadwayScripts;
    else{
      await loadScript('broadway/Decoder.js');
      await loadScript('broadway/YUVCanvas.js');
      await loadScript('broadway/Player.js');
    }
    if(typeof Player!=='function') throw new Error('Player not defined');
    const size={width:canvas.width||1088, height:canvas.height||832};
    let p;
    try{
      p=new Player({useWorker:true, workerFile:'broadway/Decoder.js', webgl:'auto', preserveDrawingBuffer:true, size});
      await waitBroadwayWorker(p);
    }catch(e){
      p=new Player({useWorker:false, webgl:'auto', preserveDrawingBuffer:true, size});
    }
    adoptPlayerCanvas(p);
    p.onPictureDecoded=function(buf,w,h){
      frames++;
      if(frames===1||frames%30===0) paintHud(w,h);
    };
    dec=p; decKind='broadway'; cfg=true;
    hudMsg('broadway ready…');
  }catch(err){ hudMsg('broadway setup failed: '+err.message); }
}

async function mkDecoder(codec){
  try{
    if(!ctx) ctx=canvas.getContext('2d');
    if(VideoDecoder.isConfigSupported){
      const s=await VideoDecoder.isConfigSupported({codec});
      if(!s.supported) codec='avc1.42e01f';
    }
    dec=new VideoDecoder({
      output:f=>{
        frames++;
        if(canvas.width!==f.displayWidth){canvas.width=f.displayWidth;}
        if(canvas.height!==f.displayHeight){canvas.height=f.displayHeight;}
        ctx.drawImage(f,0,0); f.close();
        if(frames===1||frames%30===0) paintHud(f.displayWidth,f.displayHeight);
      },
      error:e=>hudMsg('decoder error: '+e.message)
    });
    dec.configure({codec, optimizeForLatency:true});
    decKind='webcodecs'; cfg=true;
  }catch(err){ hudMsg('decoder setup failed: '+err.message); }
}

/* Video socket reconnects: Fit: Adaptive restarts the encoder at a new size,
   so the next stream may have new dimensions. WebCodecs is rebuilt from the
   new SPS; the canvas bitmap follows f.displayWidth/Height. */
let vws=null;
function resetVideo(){
  if(decKind==='webcodecs'&&dec){ try{dec.close();}catch(e){} dec=null; cfg=false; setup=null; }
  started=false; spsPps=null;
}
function connectVideo(){
  vws=new WebSocket(base+'/sockets/display');
  vws.binaryType='arraybuffer';
  vws.onopen =()=>hudMsg('video socket open…');
  vws.onclose=()=>{ hudMsg('video socket closed — reconnecting…'); resetVideo(); setTimeout(connectVideo,1000); };
  vws.onmessage=onVideo;
}
function feedNal(b, hasSPS, hasIDR){
  if(!cfg || !dec) return;
  if(!started){ if(!hasIDR) return; started=true; }
  const data=(hasIDR&&!hasSPS&&spsPps)?cat(spsPps,b):b;
  try{
    if(decKind==='webcodecs'){
      dec.decode(new EncodedVideoChunk({type:hasIDR?'key':'delta',timestamp:ts, data}));
    }else{
      dec.decode(data);
    }
    ts+=33333;
  }catch(e){}
}
async function onVideo(ev){
  const b=new Uint8Array(ev.data); bytes+=b.length;
  const {types,spsOff}=scan(b);
  const hasSPS=types.has(7), hasIDR=types.has(5);
  if(hasSPS) spsPps=b;
  if(!cfg){
    if(!hasSPS) return;
    if(!setup){
      const codec='avc1.'+hx(b[spsOff+1])+hx(b[spsOff+2])+hx(b[spsOff+3]);
      setup=hasWC?mkDecoder(codec):mkBroadway();
    }
    await setup;
  }
  feedNal(b, hasSPS, hasIDR);
}
connectVideo();

/* ---------- input ---------- */
let tws=null, inputReady=false, tBack=1000;
function connectTouch(){                         // auto-reconnect, backoff 1s→10s
  tws=new WebSocket(base+'/sockets/touchscreen');
  tws.onopen =()=>{inputReady=true; tBack=1000;};
  tws.onclose=()=>{inputReady=false; setTimeout(connectTouch,tBack); tBack=Math.min(tBack*2,10000);};
}
connectTouch();
function send(type, ev){
  if(!inputReady) return;
  const r=canvas.getBoundingClientRect();
  const p=(ev.touches&&ev.touches[0])||(ev.changedTouches&&ev.changedTouches[0])||ev;
  const x=(p.clientX-r.left)/r.width, y=(p.clientY-r.top)/r.height;
  if(x<0||x>1||y<0||y>1) return;
  tws.send(JSON.stringify({type, x, y}));
}
let dragging=false;
function cap(el,id){ try{ el.setPointerCapture(id); }catch(e){} }
feed.addEventListener('pointerdown',e=>{dragging=true;cap(feed,e.pointerId);send('down',e);e.preventDefault();});
feed.addEventListener('pointermove',e=>{if(dragging)send('move',e);e.preventDefault();});
feed.addEventListener('pointerup',  e=>{dragging=false;send('up',e);e.preventDefault();});
feed.addEventListener('pointercancel',e=>{dragging=false;send('up',e);});
feed.addEventListener('contextmenu',e=>e.preventDefault());
// tap the HUD area to toggle it
addEventListener('keydown',e=>{ if(e.key==='h') hud.classList.toggle('hide'); });
document.getElementById('reboot').addEventListener('click', async ()=>{
  const b=document.getElementById('reboot');
  if(b.disabled) return;
  b.disabled=true;
  try{
    await fetch('/api/reboot',{method:'POST',credentials:'same-origin',cache:'no-store'});
  }catch(e){}
});
/* ---------- Fit: Fixed / Stretch / Adaptive ----------
   Adaptive = resize the Pi's real X screen to viewport CSS px x devicePixelRatio
   (multiples of 8, clamped 640x480..1920x1080) via POST /api/screen, so the
   stream is 1:1 with no bars/stretch. Leaving Adaptive restores 1088x832.
   Fixed = native aspect, letterboxed. Stretch = canvas CSS box is 100vw x 100vh.
   Touch mapping uses canvas.getBoundingClientRect() with independent x/y
   normalisation, so it is correct in both modes (canvas bitmap fills its box). */
const FIT_KEY='tl.desktop.fit';
const FIT_MODES=['fixed','stretch','adaptive'], FIT_LABEL={fixed:'Fixed',stretch:'Stretch',adaptive:'Adaptive'};
let fitMode='fixed';
try{ const v=localStorage.getItem(FIT_KEY); if(FIT_MODES.includes(v)) fitMode=v; }catch(e){}
const fitBtn=document.getElementById('fit');
function applyFit(){
  document.body.classList.toggle('fit-stretch', fitMode==='stretch');
  fitBtn.textContent='Fit: '+FIT_LABEL[fitMode];
  fitBtn.setAttribute('aria-pressed', String(fitMode!=='fixed'));
}
function adaptiveSize(){
  const dpr=window.devicePixelRatio||1, r8=v=>Math.round(v/8)*8;
  const w=Math.max(640,Math.min(1920,r8(window.innerWidth*dpr)));
  const h=Math.max(480,Math.min(1080,r8(window.innerHeight*dpr)));
  return {w,h};
}
let sentSize='', screenTimer=null;
async function postScreen(body){
  const key=JSON.stringify(body);
  if(key===sentSize) return;
  try{
    const r=await fetch('/api/screen',{method:'POST',credentials:'same-origin',cache:'no-store',
      headers:{'Content-Type':'application/json'},body:key});
    if(r.status===429){ const s=+(r.headers.get('Retry-After')||3); schedScreen(s*1000); return; }
    if(r.ok) sentSize=key;
  }catch(e){}
}
function schedScreen(ms){
  clearTimeout(screenTimer);
  screenTimer=setTimeout(()=>{ if(fitMode==='adaptive') postScreen(adaptiveSize()); }, ms==null?500:ms);
}
function onLayout(){ applyFit(); if(fitMode==='adaptive') schedScreen(); }
fitBtn.addEventListener('click',()=>{
  const prev=fitMode;
  fitMode=FIT_MODES[(FIT_MODES.indexOf(fitMode)+1)%FIT_MODES.length];
  try{ localStorage.setItem(FIT_KEY,fitMode); }catch(e){}
  applyFit();
  if(fitMode==='adaptive') schedScreen(0);
  else if(prev==='adaptive'){ clearTimeout(screenTimer); postScreen({reset:true}); }
});
['resize','orientationchange','fullscreenchange','webkitfullscreenchange'].forEach(t=>addEventListener(t,onLayout));
document.addEventListener('fullscreenchange',onLayout);
applyFit();
if(fitMode==='adaptive') schedScreen(0);
const fsBtn=document.getElementById('fs'), de=document.documentElement;
const reqFs=de.requestFullscreen||de.webkitRequestFullscreen;
if(reqFs){
  fsBtn.hidden=false;
  fsBtn.addEventListener('click',()=>{
    const cur=document.fullscreenElement||document.webkitFullscreenElement;
    try{
      if(cur) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
      else { const r=reqFs.call(de); if(r&&r.catch) r.catch(()=>{}); }
    }catch(e){}
  });
}
document.getElementById('hide').addEventListener('click',()=>{
  document.body.classList.add('chrome-off');
});

/* ---------- audio: raw S16LE PCM -> Web Audio ----------
   Starts automatically on load. Some browsers' autoplay policy opens the
   AudioContext "suspended"; any later gesture resumes it, so a click is a
   fallback, not a requirement. */
const RATE=48000, CH=2;
// Jitter buffer: aim TARGET s ahead of the audio clock. Small drift/jitter is
// absorbed by a tiny (±1%, inaudible) playbackRate nudge instead of snapping,
// and only a large backlog (> HARD_MAX) drops chunks to catch up. Snapping on a
// small window (old 150 ms) made regular audible glitches from clock drift and
// network bursts.
const TARGET=0.20, MAX_AHEAD=0.30, HARD_MAX=0.60, LOW=0.12;
let actx=null, playAt=0, aws=null, abytes=0, audioOn=false, aUnder=0, aDrop=0;
function snapPlayAt(pad){
  if(!actx) return;
  playAt=actx.currentTime+(pad==null?TARGET:pad);
}
function schedulePcm(buf){
  const now=actx.currentTime;
  if(playAt<now+0.005){ aUnder++; playAt=now+TARGET; }   // underrun: refill to target
  let ahead=playAt-now;
  if(ahead>HARD_MAX){ aDrop++; return; }                  // big backlog: drop chunk
  const s=actx.createBufferSource(); s.buffer=buf;
  const rate=ahead>MAX_AHEAD?1.01:(ahead<LOW?0.99:1);
  s.playbackRate.value=rate; s.connect(actx.destination);
  s.start(playAt); playAt+=buf.duration/rate;
}
let aBack=1000;
function connectAudio(){                         // auto-reconnect, backoff 1s→10s
  aws=new WebSocket(base+'/sockets/audio');
  aws.binaryType='arraybuffer';
  aws.onmessage=ev=>{
    const pcm=new Int16Array(ev.data); abytes+=ev.data.byteLength;
    const n=pcm.length/CH;
    if(!n) return;
    const buf=actx.createBuffer(CH,n,RATE);
    for(let c=0;c<CH;c++){
      const out=buf.getChannelData(c);
      for(let i=0;i<n;i++) out[i]=pcm[i*CH+c]/32768;
    }
    schedulePcm(buf);
  };
  aws.onopen =()=>{ audioOn=true; aBack=1000; snapPlayAt(TARGET); };   // refill jitter buffer
  aws.onclose=()=>{ audioOn=false; setTimeout(connectAudio,aBack); aBack=Math.min(aBack*2,10000); };
}
function startAudio(){
  if(actx) return;
  actx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:RATE});
  snapPlayAt(TARGET);                            // jitter buffer
  connectAudio();
  if(actx.state==='suspended') actx.resume();
}
startAudio();                                   // no click required where policy allows
const resumeAudio=()=>{                         // fallback: any gesture un-suspends it
  if(!actx) startAudio();
  if(actx && actx.state==='suspended'){
    const p=actx.resume();
    if(p&&typeof p.then==='function') p.then(()=>snapPlayAt(TARGET)).catch(()=>{});
    else snapPlayAt(TARGET);
  }else if(actx && actx.state==='running'){
    if(playAt-actx.currentTime>HARD_MAX) snapPlayAt(TARGET);
  }
};
['pointerdown','keydown','touchstart'].forEach(t=>addEventListener(t,resumeAudio,{passive:true}));
if(!hasWC) hudMsg('VideoDecoder absent — broadway fallback…');
</script>
